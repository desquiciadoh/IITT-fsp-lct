x-backend-env: &backend-env
  DEBUG: "False"
  DEMO_MODE: "True"
  AUTO_SEED: "True"
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-for-local-testing-and-verification-fsp-draft-2026}
  ALLOWED_HOSTS: "localhost,127.0.0.1,api,web"
  CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000"
  PUBLIC_BASE_URL: "http://localhost:8000"
  # In-app mock IdP (DEMO_MODE): browser-facing issuer + server-to-server URL
  OIDC_ISSUER: "http://localhost:8000/idp/realms/fsp"
  OIDC_INTERNAL_URL: "http://localhost:8000/idp/realms/fsp"
  # Plain-HTTP local stack: the server-to-server IdP calls must not be redirected to https
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  POSTGRES_DB: ${POSTGRES_DB:-fsp_draft}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  ITEM_SEED_SECRET: ${ITEM_SEED_SECRET:-dev-item-seed-secret-for-hmac-deterministic-test-seed}
  CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp_draft}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fsp_draft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 -k uvicorn.workers.UvicornWorker --workers 3 --timeout 60
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/csrf"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info -Q celery
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  worker-llm:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info -Q llm --concurrency=1
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
