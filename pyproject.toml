[project]
name = "fsp-draft"
version = "0.1.0"
description = "FSP Draft: Reverse Recruitment Platform Backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".agents",
    "__pycache__",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by black/formatter
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise ... from err
]
