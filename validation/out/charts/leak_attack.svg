<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <rect width="100%" height="100%" fill="#ffffff" />
  <style>
    .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; }
