name: CI

on:
  push:
  pull_request:

jobs:
  backend-checks:
    name: Backend Lint, Test & OpenAPI Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: fsp_draft_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies (WeasyPrint / Cairo / Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf2.0-0 shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov ruff

      - name: Run Ruff Lint
        run: |
          ruff check apps config tests

      - name: Django System Check
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key-temporary-for-check"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ITEM_SEED_SECRET: "ci-item-seed-secret"
        run: |
          python manage.py check

      - name: Django Production Deployment Check
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-long-production-secret-key-with-more-than-50-characters-and-entropy-ok"
          ALLOWED_HOSTS: "staging.fsp-draft.ru,localhost"
          ITEM_SEED_SECRET: "ci-item-seed-secret-long-entropy"
        run: |
          python manage.py check --deploy

      - name: Check Django Migrations Drift
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key-temporary-for-migrations-check"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          POSTGRES_DB: "fsp_draft_test"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgrespassword"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          ITEM_SEED_SECRET: "ci-item-seed-secret"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest Suite with Coverage
        env:
          DEBUG: "False"
          SECURE_SSL_REDIRECT: "False"
          SECRET_KEY: "ci-secret-key-temporary-for-tests"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          POSTGRES_DB: "fsp_draft_test"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgrespassword"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          ITEM_SEED_SECRET: "ci-item-seed-secret"
        run: |
          pytest --cov=apps --cov-fail-under=75

      - name: Verify OpenAPI Schema Drift
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key-temporary-for-openapi"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ITEM_SEED_SECRET: "ci-item-seed-secret"
        run: |
          python manage.py spectacular --file docs/openapi.json --fail-on-warn
          git diff --exit-code docs/openapi.json
